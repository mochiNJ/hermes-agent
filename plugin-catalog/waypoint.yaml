sha: 971bab6762466bfdf6036aeaeb35352d6308f61d
description: "Session status for Hermes Desktop: a thin bar next to every sidebar session with four states — Working (remembers your next step), Waiting on someone (who/what plus a follow-up reminder), Done (outcome plus a fresh-start handoff) and untracked. Suggests 3 next steps per session (instant quick ideas from the chat, opt-in AI ideas from the auxiliary model, priority colours) with one-click Ask, a Power up button that asks a strong model for sharper ideas on demand, and Mark complete to stop suggestions. Adds a Status Board page (columns, follow-ups due, stale sessions, archive all done), triage of untracked sessions, a resume banner above the composer, a status-bar counter, a daily summary, palette commands and English/Arabic (RTL). SDK-only: session-row slots, a route, sidebar nav, status bar, composer banner, palette. Disclosure — no network calls of its own; AI next-step suggestions are OFF by default, and when the user enables them the plugin sends the last ~12 messages (trimmed, at most ~7,000 characters) of the focused session plus its title and the user's notes to the user's Hermes auxiliary model via llm.oneshot (task title_generation, never the session's main model); Power up (only when pressed) sends a longer excerpt (last ~20 messages, ≤ ~12,000 characters) to the plugin's own auxiliary tasks waypoint_ideas or waypoint_ideas_2 (registered by __init__.py, chosen from the Power up menu; unset it resolves like any auxiliary task), or to the session's own model if the user picks that in settings; the Python half registers two observe-only hooks (pre_auxiliary_call, post_auxiliary_call), filtered to those two tasks, that write one line per Power up call to the user's own Hermes log (logs/agent.log) and append a record to <HERMES_HOME>/plugin-data/waypoint/power-calls.jsonl (rolls over at ~1 MB): model, provider, reasoning effort, response time, token counts (or 'unknown' when Hermes does not report them), finish reason and status, never prompt or reply text, stays local; the hooks never modify a call; an optional automatic big idea (off by default) uses the same task at most every 10 minutes; reads session history via session.history for the focused session; statuses and notes are stored in the desktop plugin storage keyed by the durable session id; reads session titles via session.list; archives a session via session.archive only when you press Archive (undo offered); posts in-app and native OS notifications for due reminders; writes a composer draft only when you press Insert or Start fresh session."
